<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 상태 변경</title>
</head>
<body>
    <!-- 로그인 상태 변경 -->
    <button id="loginBtn">로그인</button>
    <p id="text">로그아웃 상태</p>

    <!-- 좋아요 버튼 -->
    <button id="likeBtn">lkie 🤍</button>

    <script>
        // 로그인 상태 변경
        const btn = document.querySelector("#loginBtn");
        const text = document.querySelector("#text")

        // 로그인 상태
        let isLogin = false;
        // 로그인 상태 변경 함수
        btn.addEventListener("click", function(){
            console.log("click");
            if(isLogin){
                // 로그인 상태 -> 로그아웃
                isLogin = false;
                text.textContent = "로그아웃 상태";
                btn.textContent = "로그인";

            }else{
                // 현재 로그아웃 상태 -> 로그인으로 바꾸기
                isLogin = true;
                text.textContent = "로그인 상태"
                btn.textContent = "로그아웃"

            }
        });


        // 좋아요 버튼
        const likeBtn = document.querySelector("#likeBtn");
        let isLike = false;


        likeBtn.addEventListener("click", ()=>{
            isLike = !isLike // 상태 토글
            if(isLike){
                likeBtn.textContent = "lkie 💙"
            } else{
                likeBtn.textContent = "lkie 🤍"
            }
        })
    </script>
</body>
</html>
